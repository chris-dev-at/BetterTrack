<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090c10" />
    <meta name="theme-color" content="#090c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f2f3" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BetterTrack" />
    <link rel="icon" type="image/png" href="/BT_AppIcon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/bettertrack-maskable-192.png" />
    <title>BetterTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config (window.__BT__) — must load before the app bundle. Served
         from /public in dev; overwritten per-origin by nginx in production. -->
    <script src="/config.js"></script>
    <!--
      Theme, before the first paint (see src/user/theme.ts). Inline and
      synchronous: stamping the root from a React effect instead would paint the
      whole app in the wrong theme for a frame on every load, which reads as a
      flash of dark on a light desktop.

      It sits AFTER /config.js because the app kind is a runtime fact and the
      admin console is a separate visual system — 500-odd dark-tuned Tailwind
      utilities that no token flip reaches, so handing it `color-scheme: light`
      would only recolour its native controls and scrollbars against a canvas
      that stayed dark. #root is still empty here, so this is as pre-paint as
      the <head> would have been.

      Kept in lockstep with theme.ts by styles/themeTokens.test.ts.
    -->
    <script>
      (function () {
        try {
          if (window.__BT__ && window.__BT__.app === 'admin') return;
          var stored = localStorage.getItem('bt.ui.theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-bt-theme', theme);
          var canvas = theme === 'light' ? '#f1f2f3' : '#090c10';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', canvas);
        } catch (error) {
          /* Storage or matchMedia unavailable — dark-first is already correct. */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
