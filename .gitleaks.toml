title = "BetterTrack secret scanning"

[extend]
useDefault = true

# These exact files contain deterministic test/vector values or documented
# deployment placeholders that trigger only the generic API-key heuristic. This
# rule-level allowlist keeps every other detector active in those files and the
# generic detector active everywhere else.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Deterministic test tokens and documented non-secret placeholders"
  paths = [
    # Per-portfolio vault schema tests (#1410 E0): deterministic AES-GCM/Ed25519
    # test vectors — a fixed 16-char key fingerprint and a canonical-prefix DER
    # proof key, public by design, never real key material.
    '''^apps/api/src/__tests__/accountDeletion\.test\.ts$''',
    '''^apps/api/src/__tests__/auth\.test\.ts$''',
    '''^apps/api/src/__tests__/driveConnections\.test\.ts$''',
    '''^apps/api/src/__tests__/vaultsSchema\.test\.ts$''',
    '''^apps/api/src/__tests__/vaultBearerSync\.test\.ts$''',
    '''^apps/api/src/__tests__/accountKind\.test\.ts$''',
    '''^apps/api/src/__tests__/admin\.test\.ts$''',
    '''^apps/api/src/__tests__/appSettings\.test\.ts$''',
    '''^apps/api/src/__tests__/authGoogle\.test\.ts$''',
    '''^apps/api/src/__tests__/passwordReset\.test\.ts$''',
    '''^apps/api/src/__tests__/registrationModes\.test\.ts$''',
    '''^apps/api/src/config/__tests__/env\.test\.ts$''',
    # The §10 limiter-table test drives `loadConfig` with the SAME minimal
    # production env fixture as `env.test.ts` above — including the byte-identical
    # `BT_DATA_ENCRYPTION_KEY` placeholder, whose only requirement is being ≥32
    # characters so the production precondition passes. Same non-secret, same
    # reason, same rule-level allowlist.
    '''^apps/api/src/config/__tests__/rateLimitTable\.test\.ts$''',
    '''^apps/api/src/services/imports/__tests__/importService\.test\.ts$''',
    '''^apps/web/src/user/vault/vectors\.fixture\.json$''',
    # E3 deterministic BIP39/HKDF/AES-GCM test vectors; public, never production key material.
    '''^apps/web/src/user/vault/keys/keys\.test\.ts$''',
    # Vault conformance vectors relocated to the shared domain package (VAULT2-P5,
    # board §16): deterministic test key material (wrappedKey, contentKeyBase64,
    # header MACs, QR-wrap bytes) that both clients pin byte-for-byte — public by
    # design, not real secrets. Same rule-level allowlist as the former web path.
    '''^packages/domain/src/vaultVectors/v1\.fixture\.json$''',
    '''^packages/domain/src/vaultVectors/v2\.fixture\.json$''',
    # The redesign demo is a static SPA of hand-written fixture data; its
    # deterministic ids (e.g. `idempotencyKey: 'basis_msft_lot_2020-11'`)
    # trip only this generic heuristic.
    '''^apps/redesign-demo/src/OriginAutomation\.tsx$''',
    '''^docs/ops\.md$''',
  ]
