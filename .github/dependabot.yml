version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']
      development-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # parked behind #1031 — remove when the deliberate migration lands
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      # parked behind #1031 — remove when the deliberate migration lands
      - dependency-name: '@asteasolutions/zod-to-openapi'
        update-types: ['version-update:semver-major']
      # 0.x minors are breaking: drizzle spans the schema layer, so every bump
      # needs a dedicated tested PR that re-runs db:generate (#1217). Patches
      # still flow through the grouped lane.
      - dependency-name: drizzle-orm
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: drizzle-kit
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
