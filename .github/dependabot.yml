version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /apps/landing
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
