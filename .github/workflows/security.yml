name: Supply-chain security

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  container-scan:
    name: Nightly container scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: landing
            dockerfile: apps/landing/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build ${{ matrix.image.name }} image
        run: >-
          docker build --file ${{ matrix.image.dockerfile }}
          --tag bettertrack-${{ matrix.image.name }}:security-${{ github.sha }} .

      - name: Generate Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bettertrack-${{ matrix.image.name }}:security-${{ github.sha }}
          format: table
          output: trivy-${{ matrix.image.name }}.txt
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ matrix.image.name }}-${{ github.run_id }}
          path: trivy-${{ matrix.image.name }}.txt
          retention-days: 30
          if-no-files-found: error
