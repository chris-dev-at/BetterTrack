name: Supply-chain security

on:
  pull_request:
    # These are the complete build inputs for the three image contexts, plus the
    # workflow that defines the gate. Restricting the PR trigger keeps unrelated
    # documentation-only changes out of the image-build queue without letting a
    # changed image, base image, or dependency bypass the scan.
    paths:
      - '.dockerignore'
      - '.github/workflows/security.yml'
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/landing/**'
      - 'infra/nginx/**'
      - 'packages/**'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  container-scan:
    name: Container security (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: landing
            dockerfile: apps/landing/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build ${{ matrix.image.name }} image
        run: >-
          docker build --file ${{ matrix.image.dockerfile }}
          --tag bettertrack-${{ matrix.image.name }}:security-${{ github.sha }} .

      - name: Generate ${{ matrix.image.name }} CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bettertrack-${{ matrix.image.name }}:security-${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.image.name }}.cdx.json
          scanners: vuln
          vuln-type: os,library

      # HIGH findings remain visible in the scheduled full scan, but only
      # fixable CRITICAL findings block a PR. This makes the gate actionable
      # while the nightly report retains the broader triage signal.
      - name: Generate nightly HIGH report
        if: github.event_name == 'schedule'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bettertrack-${{ matrix.image.name }}:security-${{ github.sha }}
          format: table
          output: trivy-${{ matrix.image.name }}-high.txt
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH
          scanners: vuln
          skip-setup-trivy: true

      - name: Gate fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bettertrack-${{ matrix.image.name }}:security-${{ github.sha }}
          format: table
          output: trivy-${{ matrix.image.name }}.txt
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln
          skip-setup-trivy: true

      - name: Upload Trivy report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ matrix.image.name }}-${{ github.run_id }}
          path: trivy-${{ matrix.image.name }}*.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload CycloneDX SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.image.name }}-${{ github.run_id }}
          path: sbom-${{ matrix.image.name }}.cdx.json
          retention-days: 30
          if-no-files-found: error
