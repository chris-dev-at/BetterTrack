name: CI

# No push:main trigger on purpose: the "require branches up to date" ruleset
# re-runs this exact suite on the PR right before merge, so the merge commit's
# tree is always the tree that was just tested — a post-merge run on main would
# be a byte-identical third pass. Nightly e2e still exercises main directly.
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # Full history so the migrations-immutable gate can diff the PR's drizzle
        # journal against origin/main (#606). Shallow checkout would silently
        # no-op that check.
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      # The action writes this generated SARIF report into the checkout even
      # when artifact upload is disabled. Keep generated scanner output out of
      # the existing repository-wide format gate below.
      - name: Remove generated Gitleaks report
        run: rm -f results.sarif

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test production dependency-audit verifier
        run: node --test .github/scripts/audit-production-dependencies.test.mjs

      - name: Audit production dependencies
        run: node .github/scripts/audit-production-dependencies.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Factory protocol tests (offline)
        run: ./multi-factory/test.sh

      - name: OpenAPI coverage gate
        run: pnpm --filter @bettertrack/api check:openapi-coverage

      - name: Migrations immutable gate
        # Freeze released migrations (#606): a deployed DB re-runs any journal
        # entry whose `when` moves above its high-water mark, so an existing
        # entry's when/tag/.sql must never change — only appends are allowed.
        run: |
          git fetch origin main --quiet
          pnpm --filter @bettertrack/api check:migrations-immutable

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: bettertrack_test
          POSTGRES_USER: bt
          POSTGRES_PASSWORD: bt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bt -d bettertrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations against real Postgres
        run: pnpm --filter @bettertrack/api db:migrate
        env:
          DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_test

      - name: Run integration test slice (real Postgres + Redis)
        run: pnpm --filter @bettertrack/api test:integration
