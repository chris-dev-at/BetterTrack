name: CI

# No push:main trigger on purpose: the "require branches up to date" ruleset
# re-runs this exact suite on the PR right before merge, so the merge commit's
# tree is always the tree that was just tested — a post-merge run on main would
# be a byte-identical third pass. Nightly e2e still exercises main directly.
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history so the migrations-immutable gate can diff the PR's drizzle
        # journal against origin/main (#606). Shallow checkout would silently
        # no-op that check.
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.24.3'
          # SHA-256 for gitleaks_8.24.3_linux_x64.tar.gz from the v8.24.3 release.
          GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir --parents "$bin_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$bin_dir" gitleaks
          chmod 0755 "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan committed pull-request history for secrets
        if: github.event_name == 'pull_request'
        env:
          # Use the event's full PR boundary rather than an API commit list: the
          # latter is paginated, while this range includes PRs with over 30 commits.
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gitleaks detect --source . --config .gitleaks.toml
          --log-opts="${GITLEAKS_BASE_SHA}..${GITLEAKS_HEAD_SHA}"
          --redact

      - name: Scan committed repository history for secrets
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --config .gitleaks.toml --redact

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render and validate production Compose topologies
        run: pnpm --filter @bettertrack/api check:production-compose

      - name: Test production dependency-audit verifier
        run: node --test .github/scripts/audit-production-dependencies.test.mjs

      - name: Audit production dependencies
        run: node .github/scripts/audit-production-dependencies.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Factory protocol tests (offline)
        run: ./multi-factory/test.sh

      - name: OpenAPI coverage gate
        run: pnpm --filter @bettertrack/api check:openapi-coverage

      - name: Migrations immutable gate
        # Freeze released migrations (#606): a deployed DB re-runs any journal
        # entry whose `when` moves above its high-water mark, so an existing
        # entry's when/tag/.sql must never change — only appends are allowed.
        run: |
          git fetch origin main --quiet
          pnpm --filter @bettertrack/api check:migrations-immutable

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: bettertrack_test
          POSTGRES_USER: bt
          POSTGRES_PASSWORD: bt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bt -d bettertrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations against real Postgres
        run: pnpm --filter @bettertrack/api db:migrate
        env:
          DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_test

      - name: Run integration test slice (real Postgres + Redis)
        run: pnpm --filter @bettertrack/api test:integration

  mobile-e2e:
    name: Mobile Playwright gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: bettertrack_e2e
          POSTGRES_USER: bt
          POSTGRES_PASSWORD: bt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bt -d bettertrack_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_e2e
      E2E_REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_SHARD: mobile-pr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        # ubuntu-latest already ships Chrome/Chromium and their runtime
        # libraries. Install only Playwright's version-matched headless shell so
        # an apt mirror outage cannot consume the entire bounded e2e job before
        # the regression gates start.
        run: pnpm exec playwright install --only-shell chromium

      - name: Run mobile happy path and overflow gate
        # Keep PR CI to the two regression gates; the full two-project suite is
        # still sharded nightly. The soft timeout preserves traces on a hang.
        run: >-
          timeout --signal=INT --kill-after=2m 20m
          pnpm exec playwright test
          e2e/mobile-happy-path.spec.ts e2e/mobile-overflow.spec.ts
          --project=mobile-chromium

      - name: Upload mobile Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-mobile-pr
          path: |
            blob-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
