name: E2E (nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The current suite has 53 shared tests plus three mobile-gate tests that
    # run only in the phone project: 109 project tests, or 27–28 per shard.
    # The 60-minute soft test limit leaves ten minutes before the job deadline
    # for Playwright to flush its blob report and for artifact uploads.
    # A GitHub job timeout cancels the runner before those cleanup steps can run.
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: bettertrack_e2e
          POSTGRES_USER: bt
          POSTGRES_PASSWORD: bt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bt -d bettertrack_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_e2e
      E2E_REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # ubuntu-latest already ships Chrome/Chromium and their runtime
        # libraries. Every project below is headless, so install Playwright's
        # version-matched headless shell without making apt mirrors part of the
        # browser-install critical path.
        run: pnpm exec playwright install --only-shell chromium

      - name: Run Playwright shard
        # Fail the test step before the job deadline so Playwright receives an
        # interrupt, flushes the blob reporter, and the report upload below runs.
        # Invoke Playwright directly: passing `-- --shard=…` through the pnpm
        # script forwards a literal `--` and silently runs every test per shard.
        run: timeout --signal=INT --kill-after=2m 60m pnpm exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright shard report
        # This single upload is deliberately after the soft timeout above. A
        # timed-out shard is a failed step rather than a cancelled runner, so
        # its partial blob report and traces remain available to the merge job.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
          retention-days: 7
          # An externally cancelled runner may not let Playwright flush a report.
          # Keep the diagnostics upload non-fatal; the merge job explicitly fails
          # if no usable blob archives were retained by any shard.
          if-no-files-found: ignore

  merge-report:
    name: Merge Playwright reports
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Verify shard blob reports
        shell: bash
        run: |
          shopt -s nullglob
          reports=(all-blob-reports/blob-report/*.zip)
          if (( ${#reports[@]} == 0 )); then
            echo '::error::No Playwright blob reports were uploaded by the E2E shards.'
            exit 1
          fi
          printf 'Merging %s Playwright blob report(s).\n' "${#reports[@]}"

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter=html,github,list ./all-blob-reports/blob-report

      - name: Upload merged Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
