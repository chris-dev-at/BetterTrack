name: E2E (nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Run 30146369738 reached 49 project tests in 45 minutes, or about 55 seconds
    # per test. A three-shard dispatch still exhausted 45 minutes when retries
    # doubled failing specs, so four shards cap the load at about 25 tests each.
    # Sixty minutes covers two 55-second attempts per test plus service boot and
    # report uploads; the suite's wall-clock budget is one parallel shard.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bettertrack_e2e
          POSTGRES_USER: bt
          POSTGRES_PASSWORD: bt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bt -d bettertrack_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_e2e
      E2E_REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e happy path
        run: pnpm test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright diagnostics
        # A job reaching timeout is cancelled rather than failed. Preserve the
        # traces and the shard's blob report for both outcomes so it is diagnosable.
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ matrix.shard }}
          path: |
            test-results/
            blob-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright blob report
        if: ${{ success() || failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore

  merge-report:
    name: Merge Playwright reports
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter=html,github,list ./all-blob-reports
        # A failed spec must not hide the merged HTML report; the shard remains
        # authoritative for the suite result.
        continue-on-error: true

      - name: Upload merged Playwright report
        if: ${{ success() || failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
