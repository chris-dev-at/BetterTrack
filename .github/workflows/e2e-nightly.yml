name: E2E (nightly)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Sharded four ways across the two projects (`chromium` + `mobile-chromium`).
    # Deliberately NO headcount here any more: the previous one ("72 shared tests
    # … ~38 per shard") drifted the moment a spec landed and nobody reconciled
    # it, so it was silently wrong while reading as budgeted fact. For the live
    # figure run `pnpm exec playwright test --list`; the merged report prints the
    # real per-shard totals for the run you are actually looking at. The
    # desktop-only vault arcs skip immediately in the phone project and cost a
    # shard nothing; the fixture-free guards ([E10-A0], the V5-P14 manifest gate)
    # need no browser and run in both projects for the price of a file read.
    # The 60-minute soft test limit leaves ten minutes before the job deadline
    # for Playwright to flush its blob report and for artifact uploads.
    # A GitHub job timeout cancels the runner before those cleanup steps can run.
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: bettertrack_e2e
          POSTGRES_USER: bt
          POSTGRES_PASSWORD: bt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bt -d bettertrack_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://bt:bt@localhost:5432/bettertrack_e2e
      E2E_REDIS_URL: redis://localhost:6379
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}
      # Keep the page aria snapshot out of `error-context.md`. This job uploads
      # `test-results/` and `blob-report/` for 7 days, and an aria snapshot
      # prints input VALUES in cleartext — the paranoid specs type real device
      # passwords and render real BIP39 phrases. `playwright.config.ts` sets the
      # same variable at config load so local runs are covered too; it is
      # repeated here so a shard stays safe however the runner is invoked.
      # This only stops the TEARDOWN snapshot; the matcher's own snapshot is
      # stripped in the specs (see e2e/support/artifactHygiene.ts).
      PLAYWRIGHT_NO_COPY_PROMPT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright shard
        # Fail the test step before the job deadline so Playwright receives an
        # interrupt, flushes the blob reporter, and the report upload below runs.
        # Invoke Playwright directly: passing `-- --shard=…` through the pnpm
        # script forwards a literal `--` and silently runs every test per shard.
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout --signal=INT --kill-after=2m 60m pnpm exec playwright test --shard=${{ matrix.shard }}/4 2>&1 | tee playwright-shard.log
          playwright_status=${PIPESTATUS[0]}
          set -e

          transport_errors=$(grep -Ec '(ECONNRESET|EPIPE)' playwright-shard.log || true)
          totp_errors=$(grep -Ec 'TWO_FACTOR_INVALID_CODE' playwright-shard.log || true)
          rate_limit_errors=$(grep -Ec 'RATE_LIMITED' playwright-shard.log || true)
          printf 'Playwright exit code: %s\n' "$playwright_status"
          printf 'ECONNRESET/EPIPE errors: %s\n' "$transport_errors"
          printf 'TWO_FACTOR_INVALID_CODE errors: %s\n' "$totp_errors"
          printf 'RATE_LIMITED errors: %s\n' "$rate_limit_errors"
          if (( transport_errors > 0 )); then
            echo '::error::The e2e stack emitted transport reset errors; inspect playwright-shard.log.'
          fi
          if (( totp_errors > 0 )); then
            echo '::error::The e2e stack emitted invalid-TOTP errors; inspect playwright-shard.log.'
          fi
          if (( rate_limit_errors > 0 )); then
            echo '::error::The e2e stack emitted rate-limit errors; inspect playwright-shard.log.'
          fi
          if (( playwright_status == 0 && (transport_errors > 0 || totp_errors > 0 || rate_limit_errors > 0) )); then
            exit 1
          fi
          exit "$playwright_status"

      - name: Upload Playwright shard report
        # This single upload is deliberately after the soft timeout above. A
        # timed-out shard is a failed step rather than a cancelled runner, so
        # its partial blob report and traces remain available to the merge job.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: |
            blob-report/
            test-results/
            playwright-shard.log
          retention-days: 7
          # An externally cancelled runner may not let Playwright flush a report.
          # Keep the diagnostics upload non-fatal; the merge job explicitly fails
          # if no usable blob archives were retained by any shard.
          if-no-files-found: ignore

  merge-report:
    name: Merge Playwright reports
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Verify shard blob reports
        shell: bash
        run: |
          shopt -s nullglob
          reports=(all-blob-reports/blob-report/*.zip)
          if (( ${#reports[@]} == 0 )); then
            echo '::error::No Playwright blob reports were uploaded by the E2E shards.'
            exit 1
          fi
          printf 'Merging %s Playwright blob report(s).\n' "${#reports[@]}"

      - name: Verify V5-P14 required scenarios
        # THE PHASE GATE (#1683). V5-P14's acceptance line is "nightly e2e green
        # incl. all new flows", and it names ten flows. Playwright's own exit
        # code only means "nothing that ran, failed" — an unconditionally
        # skipped spec, an empty `test.fixme`, or a spec that stopped being
        # collected all report the same green. `e2e/support/v5Gate.mjs` maps
        # each of the ten to the test that proves it; this step fails the run
        # when a mapped test did not produce a passing result, and prints a
        # covered/waived/failed count into the job summary so "green" can never
        # again be read as "all ten ran".
        #
        # It SUBSUMES the former bespoke "Verify PD9 cleartext proof" step: that
        # assertion is now `V5_STEP_PROOFS` in the same manifest, graded by the
        # same parser instead of by a second hand-rolled one. It stays a STEP
        # proof rather than a scenario because it counts occurrences of one step
        # inside a test — two would mean a second, unaudited database.
        shell: bash
        run: |
          shopt -s nullglob
          reports=(all-blob-reports/blob-report/*.zip)
          combined_report=$(mktemp)
          trap 'rm -f "$combined_report"' EXIT
          for report in "${reports[@]}"; do
            unzip -p "$report" report.jsonl >> "$combined_report"
          done

          node e2e/support/v5GateReport.mjs "$combined_report"

      - name: Merge Playwright reports
        run: pnpm exec playwright merge-reports --reporter=html,github,list ./all-blob-reports/blob-report

      - name: Upload merged Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error
