# BetterTrack DEV BOX edge additions — the *.dev.bettertrack.at staging origin.
#
# Mounted into the `web` nginx container's conf.d by infra/docker-compose.devbox.yml,
# exactly the way the live box mounts infra/live/edge/bt-live-edge.conf. It is the
# dev-box counterpart of that file and deliberately mirrors its structure; read
# that file's header before changing anything here.
#
# ── The four traps this file is shaped around ────────────────────────────────
#
# 1. LOAD ORDER / SHADOWING. nginx includes conf.d/*.conf in glob order and keeps
#    the FIRST server block when a listen+server_name pair is duplicated. This
#    file sorts before default.conf (the entrypoint's template render), so the
#    api block below SHADOWS the template's api block. The "conflicting server
#    name" warning in the nginx log is expected and benign.
#
# 2. DUPLICATE MAP NAMES ARE FATAL. The template declares
#    `map $http_upgrade $connection_upgrade`. Re-declaring that name here makes
#    nginx refuse to boot, so the WebSocket map below has its OWN name,
#    $bt_connection_upgrade — two independent maps over the same input, zero
#    collision. Same reasoning for $bt_proto (the template declares no such map).
#
# 3. add_header DOES NOT MERGE. A server or location that declares any add_header
#    drops every inherited one. So the http-level SEO fence below only reaches
#    blocks that declare no add_header of their own (the api origin, and the
#    catch-all); every block here that includes the shared security-header file
#    re-states X-Robots-Tag explicitly.
#
# 4. SERVER_NAME CANNOT BE TEMPLATED. This file is mounted verbatim — nothing
#    envsubst's it — while the topology (BT_DOMAIN / BT_SUB_*) comes from env.
#    Two consequences, both handled below:
#      · blocks that must SHADOW a template block (the api origin) list the
#        hostnames of BOTH documented naming shapes; whichever one the env
#        selects is the one that collides and wins, the other is inert.
#      · blocks that only need to ADD an origin (the demo) use a REGEX
#        server_name. Regex names are matched only after exact names and
#        wildcards, so they can never accidentally shadow a template block.
#    If you deploy this box under a THIRD naming shape, add its api hostname to
#    the api block — everything else keeps working, you just lose the api-origin
#    header hardening (real-IP recovery below is http-level and unconditional).

# ── Real client IPs ──────────────────────────────────────────────────────────
# Docker Desktop on macOS NATs every inbound connection through its gateway, so
# $remote_addr is always a private address and useless for rate limiting (§10).
# Recover the visitor IP from Cloudflare's CF-Connecting-IP header for any
# private-range peer — all traffic arrives that way on this host.
#
# TRADE-OFF, identical to the live box: anything that can reach this origin
# directly (bypassing Cloudflare) also arrives from a private NAT address and can
# therefore FORGE CF-Connecting-IP, i.e. forge the rate-limit key. The edge-secret
# gate below is the answer to that; see docs/deploy/devbox.md "Exposure".
# http-level ⇒ applies to every server block, including the template's.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# HTTPS terminates at Cloudflare; the origin hop is plain HTTP on port 80. Pass
# the edge protocol through instead of stamping nginx's own "http".
map $http_x_forwarded_proto $bt_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

# WebSocket upgrade forwarding (realtime gateway, /ws). Uniquely named so it
# never collides with the template's $connection_upgrade map (trap 2).
map $http_upgrade $bt_connection_upgrade {
    default upgrade;
    ''      close;
}

# Edge-secret gate (defense in depth). A Cloudflare transform rule stamps
# x-bt-edge on every proxied request; once enforced, requests that did not come
# through Cloudflare cannot reach the api or demo origins even with a forged Host
# header. Compose mounts the DISABLED stub by default (gate open) — point
# BT_DEVBOX_EDGE_SECRET_INC at a file outside the repo to enforce it.
include /etc/nginx/conf.d/edge-secret.inc;

# ── SEO fence ────────────────────────────────────────────────────────────────
# NOTHING on the dev box may be indexed — it is a public mirror of the product
# and would otherwise compete with bettertrack.at for the same content.
# Declared at http level; per trap 3 this reaches the api origin and the
# catch-all, while every other block below re-states it.
add_header X-Robots-Tag "noindex, nofollow" always;

# ── API origin (shadows the template block) ──────────────────────────────────
# Both documented naming shapes (trap 4). Exactly one of these names is also
# rendered by the template; that one is shadowed here, the other is inert.
#   shape A: BT_DOMAIN=dev.bettertrack.at, BT_SUB_API=api      → api.dev.bettertrack.at
#   shape B: BT_DOMAIN=bettertrack.at,     BT_SUB_API=api-dev  → api-dev.bettertrack.at
server {
    listen 80;
    server_name api.dev.bettertrack.at api-dev.bettertrack.at;

    if ($bt_edge_ok = 0) {
        return 444;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # Forward the WebSocket upgrade (realtime gateway /ws); without these two
        # headers nginx strips the handshake and socket.io falls back to polling (#396).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bt_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REPLACE, not append: $proxy_add_x_forwarded_for would carry whatever the
        # client sent, letting a caller pad the list the api's `trust proxy` hop
        # reads. $remote_addr is the CF-recovered visitor address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $bt_proto;
        # Long-lived sockets: engine.io pings every ~25s — keep the upstream read
        # open well past that so idle connections are not torn down mid-session.
        proxy_read_timeout 300s;
    }
}

# ── Demo origin: demo.<domain> → apps/redesign-demo (static) ─────────────────
# ADDS an origin, so a regex server_name is safe and shape-independent (trap 4):
# it matches demo.dev.bettertrack.at (shape A) and demo-dev.bettertrack.at
# (shape B) without knowing BT_DOMAIN. Production has no demo origin — this
# block deliberately lives here and NOT in infra/nginx/templates/.
server {
    listen 80;
    server_name ~^demo(?:-dev)?\.;

    if ($bt_edge_ok = 0) {
        return 444;
    }

    # This block declares add_header (below), so per trap 3 it must re-state the
    # http-level SEO fence itself.
    include /etc/nginx/bt-templates/includes/static-hsts.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://demo:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $bt_proto;
    }
}

# ── Dev apex (shape A only): dev.bettertrack.at → static product landing ─────
# Mirrors the template's apex block, adding the SEO fence the template cannot
# carry: that block includes the shared security-header file, so per trap 3 it
# drops the http-level X-Robots-Tag and the dev copy of the product site would be
# indexable. Shadowing it here is the only way to fence it from inside nginx.
#
# Inert under shape B — there the apex is the PRODUCTION hostname
# (bettertrack.at), which is deliberately NOT listed here: a dev box must never
# declare itself a server for the production apex.
server {
    listen 80;
    server_name dev.bettertrack.at www.dev.bettertrack.at;

    include /etc/nginx/bt-includes/static-security-headers.conf;
    include /etc/nginx/bt-templates/includes/static-hsts.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://landing:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $bt_proto;
    }
}

# ── Everything else: closed ──────────────────────────────────────────────────
# The rendered template declares no default_server, so without this block the
# FIRST block in conf.d — the api origin — would answer every unmatched Host
# (direct-to-IP scans, stale DNS, someone else's domain pointed here). 444 closes
# the connection without a response.
#
# This box has no legacy-sites reroute: unlike the live box, nothing else is
# meant to be served from this origin. If that ever changes, copy the live conf's
# `legacy-upstream.inc` pattern rather than hardcoding a target here.
server {
    listen 80 default_server;
    server_name _;

    return 444;
}
