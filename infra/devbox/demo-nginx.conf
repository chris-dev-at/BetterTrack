# Static server for the north-star demo container (infra/devbox/demo.Dockerfile).
# Reached only through the `web` front proxy on demo.<BT_DOMAIN> — this container
# publishes no host port.
#
# X-Robots-Tag is NOT set here: the front proxy's demo block stamps it, and two
# copies of the header would be sent.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The demo is fully self-contained: every asset it loads is same-origin, it
    # calls no API, and the only external strings in the bundle are fake demo
    # URLs and SVG/MathML namespaces. So the policy can stay at 'self' — the one
    # concession is inline STYLE (React style props / Tailwind-style utilities);
    # inline SCRIPT and eval stay forbidden.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        # Cache-Control is an add_header, which drops every inherited one — so
        # the policy above is repeated here (same rule as the shared template).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths render the shell, they are not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
