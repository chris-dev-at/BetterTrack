name: bettertrack

# Production Docker Compose topology — PROJECTPLAN.md §4.6.
# All images are built from the repo root (context: ..).
# Copy infra/.env.production.example → infra/.env and fill in values before running.
#
# First-run flow:
#   docker compose build
#   docker compose run --rm api node dist/scripts/migrate.js
#   docker compose run --rm api node dist/scripts/seed.js
#   docker compose up -d

# The API and BullMQ worker load the same envSchema and may both execute feature
# code. Keep their complete production environment in this ONE anchor so a new
# key cannot reach one process while silently disappearing from the other.
x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

x-api-worker-environment: &api-worker-environment
  # Process invariants. These stay fixed because the proxy, healthcheck, and
  # durable export-volume target depend on the exact in-container values.
  NODE_ENV: production
  PORT: '3000'
  BT_EXPORT_DIR: '/var/lib/bettertrack/exports'

  # Required data stores and cookie signing.
  DATABASE_URL: '${DATABASE_URL}'
  REDIS_URL: '${REDIS_URL}'
  SESSION_SECRET: '${SESSION_SECRET}'

  # Long-lived stored-record encryption (#879). Compose refuses production
  # startup when the active id/key are missing; transition keys remain optional.
  BT_DATA_ENCRYPTION_KEY_ID: '${BT_DATA_ENCRYPTION_KEY_ID:?set BT_DATA_ENCRYPTION_KEY_ID}'
  BT_DATA_ENCRYPTION_KEY: '${BT_DATA_ENCRYPTION_KEY:?set BT_DATA_ENCRYPTION_KEY}'
  BT_DATA_ENCRYPTION_DECRYPT_KEYS: '${BT_DATA_ENCRYPTION_DECRYPT_KEYS:-}'
  TOTP_ISSUER: '${TOTP_ISSUER:-BetterTrack}'

  # Deployment topology (§11). Both processes derive identical origins for
  # CORS, cookies, generated links, and notification delivery.
  BT_MODE: '${BT_MODE:-subdomains}'
  BT_DOMAIN: '${BT_DOMAIN:-localhost}'
  BT_TLS: '${BT_TLS:-}'
  BT_SUB_API: '${BT_SUB_API:-api}'
  BT_SUB_WEB: '${BT_SUB_WEB:-web}'
  BT_SUB_ADMIN: '${BT_SUB_ADMIN:-admin}'
  BT_SUB_MOBILE: '${BT_SUB_MOBILE:-mobile}'
  BT_PORT_API: '${BT_PORT_API:-3000}'
  BT_PORT_WEB: '${BT_PORT_WEB:-8080}'
  BT_PORT_ADMIN: '${BT_PORT_ADMIN:-8081}'
  BT_PORT_PRODUCT: '${BT_PORT_PRODUCT:-8082}'
  BT_PORT_MOBILE: '${BT_PORT_MOBILE:-8083}'
  BT_API_ORIGIN: '${BT_API_ORIGIN:-}'
  BT_WEB_ORIGIN: '${BT_WEB_ORIGIN:-}'
  BT_ADMIN_ORIGIN: '${BT_ADMIN_ORIGIN:-}'
  BT_PRODUCT_ORIGIN: '${BT_PRODUCT_ORIGIN:-}'
  BT_MOBILE_ORIGIN: '${BT_MOBILE_ORIGIN:-}'

  # Email and first-admin seed inputs.
  SMTP_HOST: '${SMTP_HOST:-}'
  SMTP_PORT: '${SMTP_PORT:-}'
  SMTP_USER: '${SMTP_USER:-}'
  SMTP_PASS: '${SMTP_PASS:-}'
  SMTP_FROM: '${SMTP_FROM:-}'
  ADMIN_EMAIL: '${ADMIN_EMAIL:-}'
  ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
  ADMIN_SESSION_LIFETIME_HOURS: '${ADMIN_SESSION_LIFETIME_HOURS:-12}'
  BT_AUDIT_RETENTION_DAYS: '${BT_AUDIT_RETENTION_DAYS:-400}'
  BT_EMAIL_LOG_RETENTION_DAYS: '${BT_EMAIL_LOG_RETENTION_DAYS:-180}'

  # Provider, request-budget, and feature rollout controls.
  PROVIDER_MAX_CONCURRENCY: '${PROVIDER_MAX_CONCURRENCY:-4}'
  PROVIDER_MIN_SPACING_MS: '${PROVIDER_MIN_SPACING_MS:-250}'
  MARKET_FAILOVER_ENABLED: '${MARKET_FAILOVER_ENABLED:-false}'
  MARKET_INTEL_ENABLED: '${MARKET_INTEL_ENABLED:-}'
  REALTIME_ENABLED: '${REALTIME_ENABLED:-}'
  RATE_LIMIT_BURST_WINDOW_SEC: '${RATE_LIMIT_BURST_WINDOW_SEC:-10}'
  RATE_LIMIT_BURST_LIMIT: '${RATE_LIMIT_BURST_LIMIT:-60}'
  # Per-IP login limiter (§16 2026-07-30). Defaults mirror the schema's
  # production values; the e2e raise lives only in playwright.config.ts.
  RATE_LIMIT_LOGIN_IP_WINDOW_SEC: '${RATE_LIMIT_LOGIN_IP_WINDOW_SEC:-60}'
  RATE_LIMIT_LOGIN_IP_LIMIT: '${RATE_LIMIT_LOGIN_IP_LIMIT:-25}'

  # Optional authentication, notification, and push integrations.
  BT_GOOGLE_CLIENT_ID: '${BT_GOOGLE_CLIENT_ID:-}'
  BT_GOOGLE_CLIENT_SECRET: '${BT_GOOGLE_CLIENT_SECRET:-}'
  BT_TELEGRAM_BOT_TOKEN: '${BT_TELEGRAM_BOT_TOKEN:-}'
  BT_TELEGRAM_DISCORD_ENABLED: '${BT_TELEGRAM_DISCORD_ENABLED:-}'
  BT_FCM_SERVICE_ACCOUNT_FILE: '${BT_FCM_SERVICE_ACCOUNT_FILE:-}'
  BT_VAPID_PUBLIC_KEY: '${BT_VAPID_PUBLIC_KEY:-}'
  BT_VAPID_PRIVATE_KEY: '${BT_VAPID_PRIVATE_KEY:-}'
  BT_VAPID_SUBJECT: '${BT_VAPID_SUBJECT:-}'

  # Prometheus listener plus admin-only Grafana/Prometheus management.
  BT_METRICS_ENABLED: '${BT_METRICS_ENABLED:-true}'
  BT_METRICS_HOST: '${BT_METRICS_HOST:-0.0.0.0}'
  BT_METRICS_PORT: '${BT_METRICS_PORT:-9464}'
  BT_OBS_EXTERNAL_ACCESS: '${BT_OBS_EXTERNAL_ACCESS:-}'
  BT_GRAFANA_ADMIN_PASSWORD: '${BT_GRAFANA_ADMIN_PASSWORD:-}'
  BT_GRAFANA_INTERNAL_URL: '${BT_GRAFANA_INTERNAL_URL:-http://grafana:3000}'
  BT_PROMETHEUS_INTERNAL_URL: '${BT_PROMETHEUS_INTERNAL_URL:-http://prometheus:9090}'
  BT_GRAFANA_PUBLIC_URL: '${BT_GRAFANA_PUBLIC_URL:-}'

  # Optional local AI plus bounded MIRRORCHAIN/paranoid-vault operations.
  BT_OLLAMA_ENDPOINT: '${BT_OLLAMA_ENDPOINT:-}'
  BT_OLLAMA_MODEL: '${BT_OLLAMA_MODEL:-}'
  BT_AI_DAILY_CAP: '${BT_AI_DAILY_CAP:-20}'
  MIRROR_MAX_MEMBERS: '${MIRROR_MAX_MEMBERS:-16}'
  BT_VAULT_MAX_BYTES: '${BT_VAULT_MAX_BYTES:-16777216}'
  BT_VAULT_HISTORY_MAX_VERSIONS: '${BT_VAULT_HISTORY_MAX_VERSIONS:-10}'
  BT_VAULT_HISTORY_MAX_AGE_DAYS: '${BT_VAULT_HISTORY_MAX_AGE_DAYS:-30}'
  BT_VAULT_RATE_WINDOW_SEC: '${BT_VAULT_RATE_WINDOW_SEC:-60}'
  BT_VAULT_RATE_LIMIT: '${BT_VAULT_RATE_LIMIT:-60}'

services:
  # Front proxy: serves the user + admin SPAs and reverse-proxies the api origin.
  # One image, both topologies — BT_MODE selects the nginx layout at start (§4.6).
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Deploy marker baked into the SPA at build time (admin-login footer). The
      # live updater (infra/live/updater.sh) exports GIT_SHA/GIT_BUILD_TIME.
      args:
        GIT_SHA: '${GIT_SHA:-unknown}'
        GIT_BUILD_TIME: '${GIT_BUILD_TIME:-unknown}'
        # Public SPA OAuth client id for the browser-only Drive appdata flow.
        # No secret or Drive token is passed to the API/container runtime.
        VITE_GOOGLE_DRIVE_CLIENT_ID: '${VITE_GOOGLE_DRIVE_CLIENT_ID:-}'
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      # Topology (§11) — the same scheme the api derives its origins from.
      BT_MODE: '${BT_MODE:-subdomains}'
      BT_DOMAIN: '${BT_DOMAIN:-localhost}'
      BT_TLS: '${BT_TLS:-}'
      BT_SUB_API: '${BT_SUB_API:-api}'
      BT_SUB_WEB: '${BT_SUB_WEB:-web}'
      BT_SUB_ADMIN: '${BT_SUB_ADMIN:-admin}'
      BT_SUB_MOBILE: '${BT_SUB_MOBILE:-mobile}'
      BT_PORT_API: '${BT_PORT_API:-3000}'
      BT_PORT_WEB: '${BT_PORT_WEB:-8080}'
      BT_PORT_ADMIN: '${BT_PORT_ADMIN:-8081}'
      BT_PORT_PRODUCT: '${BT_PORT_PRODUCT:-8082}'
      BT_PORT_MOBILE: '${BT_PORT_MOBILE:-8083}'
      BT_API_ORIGIN: '${BT_API_ORIGIN:-}'
      # Same value the api reads (below). The front proxy renders the static CSP
      # at start, and the admin Diagnostics panel embeds this URL in an iframe on
      # the auth-gated-subdomain path — so frame-src must carry exactly this
      # origin. Unset ⇒ nothing is added to the policy (§13.5 V5-P2 arc (a)).
      BT_GRAFANA_PUBLIC_URL: '${BT_GRAFANA_PUBLIC_URL:-}'
      API_UPSTREAM: 'api:3000'
      # The apex product + mobile origins proxy to the static `landing` container.
      LANDING_UPSTREAM: 'landing:80'
    # Host port bindings are mode-conditional and live in the override file for
    # your topology, NOT here (a bare `docker compose up` with only this file
    # publishes no host ports at all). Layer one of:
    #   -f infra/docker-compose.yml -f infra/docker-compose.subdomains.yml
    #   -f infra/docker-compose.yml -f infra/docker-compose.ports.yml
    # See README.md "Production deploy" worked examples.
    depends_on:
      api:
        condition: service_healthy
      # nginx resolves the landing upstream hostname at startup, so it must exist.
      landing:
        condition: service_started

  # Product landing page (bettertrack.at apex origin) + mobile.* placeholder —
  # a tiny framework-free static site (§13.3 V3-P12 arcs a+b). Independent of the
  # SPA and API. It derives the web-app and API origins from the same topology
  # inputs as the front proxy so its links, registration probe, and CSP agree. In
  # both modes the `web` front proxy routes the apex + mobile origins to this
  # container over the internal network (arc (c) — no host ports of its own).
  landing:
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      # Keep runtime env.js on the exact topology used by the front proxy. The
      # explicit origin overrides win; otherwise the landing entrypoint derives
      # both origins from mode/domain/TLS plus the relevant subdomain or port.
      BT_MODE: '${BT_MODE:-subdomains}'
      BT_DOMAIN: '${BT_DOMAIN:-localhost}'
      BT_TLS: '${BT_TLS:-}'
      BT_SUB_API: '${BT_SUB_API:-api}'
      BT_SUB_WEB: '${BT_SUB_WEB:-web}'
      BT_PORT_API: '${BT_PORT_API:-3000}'
      BT_PORT_WEB: '${BT_PORT_WEB:-8080}'
      BT_API_ORIGIN: '${BT_API_ORIGIN:-}'
      BT_WEB_ORIGIN: '${BT_WEB_ORIGIN:-}'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      # Deploy marker baked into the runtime env (GET /api/v1/version). The live
      # updater (infra/live/updater.sh) exports GIT_SHA/GIT_BUILD_TIME.
      args:
        GIT_SHA: '${GIT_SHA:-unknown}'
        GIT_BUILD_TIME: '${GIT_BUILD_TIME:-unknown}'
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      # No API-only keys: both processes consume the complete shared contract.
      <<: *api-worker-environment
    volumes:
      - exportdata:/var/lib/bettertrack/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health/ready || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Worker (BullMQ processors) — same image as api, entry dist/scripts/worker.js
  # (tsup entry src/scripts/worker.ts → start:worker). Runs the scheduled +
  # event-driven jobs (§9): prices.refreshDaily, prices.backfill, fx.refreshSpot,
  # catalog.enrich, notifications.dispatch. No HTTP surface, so no host ports.
  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/scripts/worker.js']
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      # No worker-only keys: both processes consume the complete shared contract.
      <<: *api-worker-environment
    volumes:
      - exportdata:/var/lib/bettertrack/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/scripts/workerHealth.js']
      interval: 30s
      timeout: 5s
      retries: 3
      # Three heartbeat intervals: enough for scheduler registration and its
      # first proof, bounded so a loop that never starts becomes unhealthy.
      start_period: 3m

  # Scheduled local recovery points are deployment code: the service takes one
  # dump plus a safe restore drill on first start, then follows both configured
  # schedules without a host crontab. Health is derived only from the
  # machine-readable status in the dedicated status volume.
  backup-scheduler:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: bettertrack-backup:local
    entrypoint: ['/bin/bash', '/opt/bettertrack/scheduler.sh']
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_HOST: 'db'
      POSTGRES_PORT: '5432'
      POSTGRES_USER: '${POSTGRES_USER:-bt}'
      POSTGRES_DB: '${POSTGRES_DB:-bettertrack}'
      PGPASSWORD: '${POSTGRES_PASSWORD}'
      BACKUP_DIR: '/backups'
      BACKUP_RETENTION_DAYS: '${BACKUP_RETENTION_DAYS:-14}'
      BT_BACKUP_CRON: '${BT_BACKUP_CRON:-0 3 * * *}'
      BT_BACKUP_RESTORE_CRON: '${BT_BACKUP_RESTORE_CRON:-0 4 1 * *}'
      BT_BACKUP_FRESHNESS_MAX_HOURS: '${BT_BACKUP_FRESHNESS_MAX_HOURS:-26}'
      BT_BACKUP_RESTORE_MAX_AGE_DAYS: '${BT_BACKUP_RESTORE_MAX_AGE_DAYS:-35}'
      BT_BACKUP_STATUS_FILE: '/status/backup-status.env'
    volumes:
      - pgbackups:/backups
      - backupstatus:/status
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/opt/bettertrack/healthcheck.sh']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 5m

  db:
    image: postgres:17
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-bt}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-bettertrack}'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bt} -d ${POSTGRES_DB:-bettertrack}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *bounded-logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observability (§13.5 V5-P2 arc (a), §16 2026-07-17) ─────────────────────
  # Self-provisioned monitoring: Prometheus scrapes the API metrics listener
  # over the internal network; Grafana auto-wires the datasource + starter
  # dashboard on first boot (zero owner setup). Their host ports bind to
  # ${BT_OBS_BIND_HOST} (default 127.0.0.1 = localhost only; set a LAN IP for
  # LAN access) and are DELIBERATELY not routed through the public web/nginx
  # front proxy — these surfaces are never reachable from a public origin. The
  # admin panel is the only public management surface.
  prometheus:
    image: prom/prometheus:v2.53.3
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      # localhost/LAN only — never the public origin.
      - '${BT_OBS_BIND_HOST:-127.0.0.1}:${BT_PROMETHEUS_PORT:-9090}:9090'
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.3.1
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      # Local-admin bootstrap. Change the default before first boot; the owner
      # only ever reaches this over localhost/LAN, and sign-up is disabled.
      GF_SECURITY_ADMIN_USER: '${BT_GRAFANA_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${BT_GRAFANA_ADMIN_PASSWORD:-admin}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_PORT: '3000'
      # ── External access via the admin app (§13.5 V5-P2 arc (a), owner 2026-07-19) ─
      # The owner asked to reach Grafana from OUTSIDE the LAN too, but only
      # through an authenticated path. The PRIMARY path proxies through the admin
      # API (`/api/v1/admin/monitoring/grafana`, behind admin auth). For that
      # frame + sub-path to render, Grafana must allow embedding and serve from
      # the proxy sub-path. Defaults keep the localhost/LAN path unchanged; the
      # live dev sets the two SERVE_FROM_SUB_PATH/ROOT_URL vars to activate the
      # admin-proxy path (see docs/monitoring.md). Prometheus is never proxied.
      GF_SECURITY_ALLOW_EMBEDDING: '${BT_GRAFANA_ALLOW_EMBEDDING:-true}'
      GF_SERVER_ROOT_URL: '${BT_GRAFANA_ROOT_URL:-http://localhost:3000/}'
      GF_SERVER_SERVE_FROM_SUB_PATH: '${BT_GRAFANA_SERVE_FROM_SUB_PATH:-false}'
      # Anonymous read-only access: OFF by default (the localhost/LAN + auth-gated
      # subdomain paths use Grafana's own login). The admin-proxy path sets this
      # ON — the proxy already enforces admin auth, so an anonymous Viewer behind
      # it renders dashboards without a second login. Safe because Grafana's port
      # is localhost/LAN-only; external reach is admin-gated by the proxy.
      GF_AUTH_ANONYMOUS_ENABLED: '${BT_GRAFANA_ANON_ENABLED:-false}'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      # localhost/LAN only — never the public origin.
      - '${BT_OBS_BIND_HOST:-127.0.0.1}:${BT_GRAFANA_PORT:-3001}:3000'
    depends_on:
      prometheus:
        condition: service_started

  # ── Infra exporters (§13.5 V5-P2 arc (a), owner 2026-07-19) ─────────────────
  # Give the dashboards real infra health beyond the app's own /metrics.
  # DELIBERATELY publish NO host ports: Prometheus scrapes them by service name
  # over the internal docker network, so they are unreachable from any host
  # origin — stricter than even the localhost/LAN Prometheus/Grafana binds.

  # Host CPU / memory / disk / network.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host

  # Per-container CPU / memory / IO.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    logging: *bounded-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  # DB connections, slow queries, table sizes.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      DATA_SOURCE_NAME: 'postgresql://${POSTGRES_USER:-bt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bettertrack}?sslmode=disable'
    depends_on:
      db:
        condition: service_healthy

  # Cache hit rate, memory, evictions.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      REDIS_ADDR: 'redis://redis:6379'
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  exportdata:
  pgbackups:
  backupstatus:
  promdata:
  grafanadata:
