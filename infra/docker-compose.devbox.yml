# BetterTrack DEV BOX overlay (docs/deploy/devbox.md).
#
# A permanently-running, publicly reachable staging box that mirrors the real
# live deployment (PROJECTPLAN.md §4.6, §11): same images, same front proxy,
# same "TLS terminates at Cloudflare, origin hop is plain HTTP :80" shape as
# infra/live/edge/bt-live-edge.conf. It is layered ON TOP of the production
# topology, never instead of it:
#
#   docker compose \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.subdomains.yml \
#     -f infra/docker-compose.devbox.yml \
#     --env-file infra/.env.devbox \
#     up -d
#
# What this overlay adds, and nothing else:
#   1. a distinct COMPOSE PROJECT NAME + explicitly named volumes, so the dev box
#      can never share Postgres/Redis state with the production stack
#      (`bettertrack`) or the local dev stack (`bettertrack-dev`);
#   2. a `demo` service that builds and serves apps/redesign-demo as static files
#      (the north-star demo, moved off the apex onto demo.<domain>);
#   3. the dev-box edge conf mounted into the `web` container's conf.d, exactly
#      the way the live box mounts infra/live/edge/bt-live-edge.conf — Cloudflare
#      real-IP recovery, X-Forwarded-Proto pass-through, the demo server block,
#      and an opt-in edge-secret gate.
#
# NOT changed here: infra/docker-compose.yml, infra/docker-compose.subdomains.yml
# and infra/nginx/templates/** are shared with production and stay untouched.
# Production has no demo origin, so the demo server block lives only in the
# dev-box conf (infra/devbox/edge/bt-devbox-edge.conf), never in the template.

# Own project name ⇒ own container names AND own default volume namespace. The
# volumes below are additionally given explicit names so they stay distinct even
# if someone overrides the project name with `-p`.
name: bettertrack-devbox

services:
  web:
    depends_on:
      # nginx resolves `demo:80` at config load (same reason the base file waits
      # on `landing`): if the name does not resolve, the front proxy fails to
      # boot instead of starting without the demo origin.
      demo:
        condition: service_started
    volumes:
      # Loaded alongside the entrypoint's template render (conf.d/default.conf).
      # The filename sorts BEFORE default.conf, which is what lets its api server
      # blocks shadow the template's — see the conf's header for the full trap
      # list (duplicate map names, add_header inheritance, shadowing order).
      - ./devbox/edge/bt-devbox-edge.conf:/etc/nginx/conf.d/bt-devbox-edge.conf:ro
      # Edge-secret gate. The default is the repo's DISABLED stub (gate open, no
      # secret anywhere in git). To enforce it, point this at a file OUTSIDE the
      # repo holding the real secret — see docs/deploy/devbox.md "Exposure".
      # The `.inc` suffix keeps it out of nginx's conf.d/*.conf auto-include; the
      # edge conf includes it explicitly.
      - '${BT_DEVBOX_EDGE_SECRET_INC:-./devbox/edge/edge-secret.disabled.inc}:/etc/nginx/conf.d/edge-secret.inc:ro'

  # North-star redesign demo (apps/redesign-demo) — a self-contained static SPA
  # with no API dependency. Built here rather than mounted from a pre-built
  # dist/, because the repo .dockerignore excludes `**/dist` from every build
  # context: a committed-dist dependency could not be copied even if it existed.
  #
  # NOTE: apps/redesign-demo is currently UNTRACKED in git. This build therefore
  # only succeeds where that directory is present in the build context (the
  # owner's checkout). See docs/deploy/devbox.md "Prerequisites".
  demo:
    build:
      context: ..
      dockerfile: infra/devbox/demo.Dockerfile
    restart: unless-stopped
    # Deliberately NO host ports: the demo is reachable only through the `web`
    # front proxy on demo.<domain>, so the single published :80 still fronts
    # every origin (the subdomains overlay's invariant).
    healthcheck:
      # 127.0.0.1, not localhost: the image's nginx listens on IPv4 only, while
      # `localhost` resolves to ::1 first inside the container — the probe then
      # fails against a perfectly healthy server.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Explicit names ⇒ these are never confused with, and never adopted from, the
  # production stack (`bettertrack_*`) or the local dev stack
  # (`bettertrack-dev_pgdata` / `bettertrack-dev_redisdata`, the ones behind
  # localhost:5432/6379). Renaming a volume key does not migrate data: if you
  # ever change these, the box comes up EMPTY.
  pgdata:
    name: bt-devbox-pgdata
  redisdata:
    name: bt-devbox-redisdata
  exportdata:
    name: bt-devbox-exportdata
  pgbackups:
    name: bt-devbox-pgbackups
  promdata:
    name: bt-devbox-promdata
  grafanadata:
    name: bt-devbox-grafanadata
