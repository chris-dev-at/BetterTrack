name: bettertrack

# Optional encrypted offsite upload and separately credentialed retention.
#
# Both services are profile-gated one-shots. `backup-offsite` can use a
# delete-less upload credential. `backup-offsite-retention` is double-gated by
# its own profile and BT_BACKUP_REMOTE_RETENTION_ENABLED=true, and mounts only
# its separate retention credential.
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.subdomains.yml \
#     -f docker-compose.offsite.yml \
#     --profile offsite \
#     run --rm backup-offsite
#
# Upload env:
#   BT_BACKUP_AGE_RECIPIENT_HOST_FILE — host path to the age recipient (public)
#   BT_BACKUP_RCLONE_CONFIG_HOST_FILE — host path to delete-less rclone.conf
#   BT_BACKUP_RCLONE_REMOTE           — e.g. gdrive:bettertrack-backups
# Optional retention env (all required before enabling the retention profile):
#   BT_BACKUP_REMOTE_RETENTION_ENABLED
#   BT_BACKUP_RETENTION_RCLONE_CONFIG_HOST_FILE
#   BT_BACKUP_RETENTION_RCLONE_REMOTE
#   BT_BACKUP_REMOTE_RETENTION_DAYS   — default 30
services:
  backup-offsite:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: bettertrack-backup:local
    entrypoint: ['/bin/bash', '/opt/bettertrack/offsite.sh']
    restart: 'no'
    profiles: ['offsite']
    environment:
      BT_BACKUP_OFFSITE_MODE: 'upload'
      BT_BACKUP_SOURCE_DIR: '/backups'
      BT_BACKUP_AGE_RECIPIENT_FILE: '/etc/bettertrack/age-recipient'
      BT_BACKUP_RCLONE_REMOTE: '${BT_BACKUP_RCLONE_REMOTE:-}'
      BT_BACKUP_UPLOAD_RCLONE_CONFIG: '/etc/bettertrack/upload-rclone.conf'
    volumes:
      # Writable only so the upload outcome can join backup-status.env. Upload
      # mode never prunes local or remote artifacts.
      - pgbackups:/backups
      - '${BT_BACKUP_AGE_RECIPIENT_HOST_FILE}:/etc/bettertrack/age-recipient:ro'
      - '${BT_BACKUP_RCLONE_CONFIG_HOST_FILE}:/etc/bettertrack/upload-rclone.conf:ro'

  backup-offsite-retention:
    image: bettertrack-backup:local
    entrypoint: ['/bin/bash', '/opt/bettertrack/offsite.sh']
    restart: 'no'
    profiles: ['offsite-retention']
    environment:
      BT_BACKUP_OFFSITE_MODE: 'retention'
      BT_BACKUP_SOURCE_DIR: '/backups'
      BT_BACKUP_REMOTE_RETENTION_ENABLED: '${BT_BACKUP_REMOTE_RETENTION_ENABLED:-false}'
      BT_BACKUP_RETENTION_RCLONE_CONFIG: '/etc/bettertrack/retention-rclone.conf'
      BT_BACKUP_RETENTION_RCLONE_REMOTE: '${BT_BACKUP_RETENTION_RCLONE_REMOTE:-}'
      BT_BACKUP_REMOTE_RETENTION_DAYS: '${BT_BACKUP_REMOTE_RETENTION_DAYS:-30}'
    volumes:
      - pgbackups:/backups
      # /dev/null keeps the disabled profile renderable without owner setup.
      # Enabling retention without an explicit file still fails safely.
      - '${BT_BACKUP_RETENTION_RCLONE_CONFIG_HOST_FILE:-/dev/null}:/etc/bettertrack/retention-rclone.conf:ro'

volumes:
  pgbackups:
